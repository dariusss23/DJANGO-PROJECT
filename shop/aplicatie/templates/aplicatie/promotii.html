{% extends 'aplicatie/baza.html' %}

{% block titlu %} Adauga Promotii {% endblock %}

{% block content %}

<div class="form-container">
    <h1>Creaza o Promotie</h1>

    <form method="post">
        {% csrf_token %}
        
        {{ form.as_p }}

        <button type="submit" class="btn-submit">Trimite Oferta</button>
    </form>
</div>

<style>
    .form-container {
        max-width: 600px;
        margin: 50px auto;
        background-color: #ffffff;
        padding: 40px;
        border-radius: 8px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .form-container h1 {
        text-align: center;
        color: #333;
        margin-bottom: 30px;
        font-size: 24px;
    }

    .form-container p {
        margin-bottom: 20px;
    }

    .form-container label {
        display: block;         /* Le forteaza sa stea deasupra inputului */
        font-weight: bold;
        margin-bottom: 8px;
        color: #555;
    }

    .form-container input[type="text"],
    .form-container input[type="date"],
    .form-container input[type="number"],
    .form-container select {
        width: 100%;
        padding: 10px;
        border: 1px solid #ccc;
        border-radius: 4px;
        box-sizing: border-box;
        font-size: 14px;
    }

    .form-container input:focus,
    .form-container select:focus {
        border-color: #4CAF50;
        outline: none;
    }

    .form-container select[multiple] {
        height: 100px;
    }

    .form-container input[type="checkbox"] {
        width: auto;
        transform: scale(1.2);
        margin-right: 10px;
    }
    
    .btn-submit {
        width: 100%;
        padding: 12px;
        background-color: #28a745; /* Culoare verde */
        color: white;
        border: none;
        border-radius: 4px;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: background-color 0.3s;
        margin-top: 10px;
    }

    .btn-submit:hover {
        background-color: #218838;
    }

    .helptext {
        font-size: 12px;
        color: #888;
        margin-top: 5px;
        display: block;
    }
</style>
{% endblock %}
